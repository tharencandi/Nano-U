# TinyAgri config, derived from config/config.yaml (the committed generic
# template) with dataset paths filled in. Only the paths actually matter for
# src/evaluate.py against the existing checkpoint -- no retraining is done
# with this file (models/TinyAgri/nano_u.tflite already exists).

data:
  input_shape: [60, 80, 3]  # Height, Width, Channels (TF format: NHWC)
  num_classes: 1            # Binary segmentation

  # Normalization: (x / 255.0 - mean) / std  →  [-1, 1] range
  normalization:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

  split:
    train: 0.7
    validation: 0.2
    test: 0.1

  paths:
    processed:
      root: "data/TinyAgri"
      train:
        img: "data/TinyAgri/train/img"
        mask: "data/TinyAgri/train/mask"
      val:
        img: "data/TinyAgri/val/img"
        mask: "data/TinyAgri/val/mask"
      test:
        img: "data/TinyAgri/test/img"
        mask: "data/TinyAgri/test/mask"

    models_dir: "models/TinyAgri"
    results_dir: "results/TinyAgri"


models:
  bu_net:
    filters: [64, 128, 256, 512, 1024]
    bottleneck: 1024
    decoder_filters: [512, 256, 128, 64]

  nano_u:
    filters: [4, 8, 16]
    bottleneck: 16
    decoder_filters: [16, 8, 4]


training:
  seed: 37

  bu_net:
    epochs: 150
    batch_size: 32
    learning_rate: 1e-3
    weight_decay: 1e-3
    optimizer: "adamw"
    loss: "binary_crossentropy"
    augment: true
    early_stopping: true
    patience: 10
    lr_scheduler: "plateau"
    lr_plateau_patience: 10
    lr_plateau_factor: 0.2
    min_lr: 1e-6

  nano_u:
    epochs: 100
    batch_size: 16
    learning_rate: 1e-3
    weight_decay: 1e-4
    optimizer: "adamw"
    loss: "binary_crossentropy"
    augment: true
    early_stopping: true
    patience: 20
    use_nas: true
    qat_enabled: true
    lr_scheduler: "plateau"
    lr_plateau_patience: 10
    lr_plateau_factor: 0.2
    min_lr: 1e-6
    layers_to_monitor: ['enc1a_dw', 'bottleneck_a_dw', 'dec2_conv_b_pw']

    distillation:
      enabled: true
      teacher_weights: "models/TinyAgri/bu_net.h5"
      alpha: 0.5
      temperature: 4.0


quantization:
  method: "dynamic_range"
  representative_dataset_size: 100
  calibration_split: "val"
  allow_noise_calibration: false
  input_type: "int8"
  output_type: "int8"
  supported_ops:
    - "TFLITE_BUILTINS_INT8"
    - "SELECT_TF_OPS"
